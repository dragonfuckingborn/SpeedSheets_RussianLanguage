        function submitNote(submittedObj) {
            const expected = currentWordArr[currentIndex];
            const noteEl = document.getElementById(`note-${currentIndex}`);

            const strictOctave = strictOctaveToggle.checked;
            
            const isCorrect = submittedObj.char === expected.char && 
                              submittedObj.acc === expected.acc && 
                              (!strictOctave || submittedObj.octave === expected.octave);

            recordStat(expected.char, expected.octave, expected.acc, isCorrect);
            if (isCorrect) {
                if (soundToggle.checked) {
                    playNote(getNoteMidi(expected.char, expected.octave, expected.acc));
                }
                if(noteEl) {
                    noteEl.setAttribute('class', 'text-green-500 transition-colors duration-200');
                    if (overlayToggle.checked) {
                        const textEl = noteEl.querySelector('.note-letter');
                        if (textEl) {
                            textEl.classList.remove('opacity-0');
                        }
                    }
                }
                score++;
                scoreVal.textContent = score;
                currentIndex++;
                
                const mode = modeSelect.value;
                if (['random', 'words', 'practice', 'training', 'scale', 'a-g'].includes(mode) && !isTimeTrial && !isSpeedRun) {
                    if (rollingNPMTimestamps.length === 0) {
                        randomSessionStartTime = Date.now();
                        clearInterval(randomStopwatchInterval);
                        randomStopwatchInterval = setInterval(() => {
                            if (isPaused) return;
                            const diff = (Date.now() - randomSessionStartTime) / 1000;
                            if (randomStopwatchVal) randomStopwatchVal.textContent = diff.toFixed(1) + " с";
                        }, 100);
                    }
                    rollingNPMTimestamps.push(Date.now());
                    if (rollingNPMTimestamps.length > 30) {
                        rollingNPMTimestamps.shift();
                    }
                    if (rollingNPMTimestamps.length >= 2) {
                        const diffSecs = (rollingNPMTimestamps[rollingNPMTimestamps.length - 1] - rollingNPMTimestamps[0]) / 1000;
                        const numNotes = rollingNPMTimestamps.length - 1;
                        const npm = diffSecs > 0 ? Math.round(numNotes / diffSecs * 60) : 0;
                        const spn = numNotes > 0 ? (diffSecs / numNotes).toFixed(2) : "0.00";
                        npmVal.textContent = npm;
                        if (spnVal) spnVal.textContent = spn;
                    }
                }

                updateScroll();
                
                if (currentIndex === currentWordArr.length) {
                    if (['words', 'random', 'practice', 'training', 'scale', 'a-g'].includes(mode) && !isTimeTrial && !isSpeedRun) {
                        const diffSecs = ((Date.now() - wordStartTime) / 1000).toFixed(2);
                        let wordStr = "";
                        if (mode === 'practice') {
                            wordStr = "";
                        } else if (mode === 'scale') {
                            wordStr = window.currentScaleName || "Гамма";
                        } else if (mode === 'a-g') {
                            wordStr = "Прогон A-G";
                        } else {
                            wordStr = currentWordArr.map(n => n.char).join('');
                            if (wordStr.length > 12) {
                                wordStr = wordStr.substring(0, 10) + '..';
                            }
                        }
                        recentWordsTimes.push({word: wordStr, time: diffSecs});
                        if (recentWordsTimes.length > 5) {
                            recentWordsTimes.shift();
                        }
                        wordsTimerList.innerHTML = '';
                        recentWordsTimes.forEach(rt => {
                            const row = document.createElement('div');
                            row.className = 'flex justify-between items-center';
                            row.innerHTML = `<span class="uppercase tracking-widest font-bold text-[10px]">${rt.word}</span><span class="text-indigo-500 font-black">${rt.time} с</span>`;
                            wordsTimerList.appendChild(row);
                        });
                        wordsTimerList.scrollTop = wordsTimerList.scrollHeight;
                    }
                    if (isSpeedRun) {
                        endSpeedRun();
                    } else {
                        // Reset stats (NPM, time) for the next run
                        setTimeout(() => generateNewWord(false, false), 200);
                    }
                }
            } else {
                mistakes++;
                mistakeVal.textContent = mistakes;
                if (flashToggle.checked) {
                    drawFlashedNote(submittedObj, currentIndex);
                }
                if (noteEl) {
                    noteEl.setAttribute('class', 'text-[#1e293b] transition-colors duration-200');
                }
            }
        }

        function handleInput(char) {
            if (!overlay.classList.contains('hidden')) return;
            const mode = modeSelect.value;
            const isFree = mode === 'freeplay' || mode === 'recording';

            if (char === keyMap.up) {
                if (currentOctave < 3) {
                    currentOctave++;
                    updateOctaveUI();
                    if (mode === 'recording') {
                        recordedString += 'k';
                        recordingDisplay.textContent = recordedString;
                    }
                }
                return;
            }
            if (char === keyMap.down) {
                if (currentOctave > -3) {
                    currentOctave--;
                    updateOctaveUI();
                    if (mode === 'recording') {
                        recordedString += 'j';
                        recordingDisplay.textContent = recordedString;
                    }
                }
                return;
            }

            if (isFree) {
                if (char === keyMap.flat) {
                    accidentalToggle = accidentalToggle === 'b' ? null : 'b';
                    updateToggleUI();
                    return;
                }
                if (char === keyMap.sharp) {
                    accidentalToggle = accidentalToggle === '#' ? null : '#';
                    updateToggleUI();
                    return;
                }
                if (/^[a-g]+(\+[a-g]+)*$/.test(char)) {
                    let noteObj = { char, acc: accidentalToggle || '', octave: currentOctave, absIndex: totalNotesPlayed++ };
                    if (!persistentAccidentalToggle.checked) accidentalToggle = null;
                    updateToggleUI();
                    
                    if (mode === 'recording') {
                        let recChar = "";
                        if (noteObj.acc === '#') recChar += ';';
                        if (noteObj.acc === 'b') recChar += 'l';
                        recChar += char;
                        recordedString += recChar;
                        recordingDisplay.textContent = recordedString;
                    }

                    currentWordArr.push(noteObj);
                    const y = getNoteY(noteObj.char, noteObj.octave);
                    freePlayYs.push(y);

                    if (currentWordArr.length > 20) {
                        currentWordArr.shift();
                        freePlayYs.shift();
                    }
                    
                    renderGrandStaffWord(currentWordArr, freePlayYs);
                    
                    currentWordArr.forEach((_, i) => {
                        let el = document.getElementById(`note-${i}`);
                        if(el) {
                            el.setAttribute('class', 'text-green-500 transition-colors duration-200');
                            if (overlayToggle.checked) {
                                const textEl = el.querySelector('.note-letter');
                                if (textEl) textEl.classList.remove('opacity-0');
                            }
                        }
                    });

                    if (soundToggle.checked) {
                        playNote(getNoteMidi(noteObj.char, noteObj.octave, noteObj.acc));
                    }
                }
                return;
            }

            if (currentIndex >= currentWordArr.length) return;

            if (char === keyMap.flat) {
                if (pendingBaseNote) {
                    submitNote({char: pendingBaseNote.char, acc: 'b', octave: currentOctave});
                    pendingBaseNote = null;
                } else {
                    accidentalToggle = accidentalToggle === 'b' ? null : 'b';
                    updateToggleUI();
                }
                return;
            }
            if (char === keyMap.sharp) {
                if (pendingBaseNote) {
                    submitNote({char: pendingBaseNote.char, acc: '#', octave: currentOctave});
                    pendingBaseNote = null;
                } else {
                    accidentalToggle = accidentalToggle === '#' ? null : '#';
                    updateToggleUI();
                }
                return;
            }

            if (/^[a-g]+(\+[a-g]+)*$/.test(char)) {
                if (pendingBaseNote) {
                    submitNote({char: pendingBaseNote.char, acc: '', octave: currentOctave});
                    pendingBaseNote = null;
                }

                if (accidentalToggle) {
                    submitNote({char, acc: accidentalToggle, octave: currentOctave});
                    if (!persistentAccidentalToggle.checked) accidentalToggle = null;
                    updateToggleUI();
                } else {
                    const expected = currentWordArr[currentIndex];
                    if (!expected) return;
                    
                    const charMatches = expected.char === char;
                    const needsAcc = expected.acc === '#' || expected.acc === 'b';
                    
                    if (charMatches && needsAcc) {
                        pendingBaseNote = {char, octave: currentOctave};
                        const noteEl = document.getElementById(`note-${currentIndex}`);
                        if (noteEl) {
                            noteEl.setAttribute('class', 'text-amber-500 transition-colors duration-200');
                        }
                    } else {
                        submitNote({char, acc: '', octave: currentOctave});
                    }
                }
            }
        }

        document.getElementById('skipBtn').addEventListener('click', generateNewWord);
        
        const hiddenInput = document.getElementById('hiddenMobileInput');
        hiddenInput.addEventListener('input', (e) => {
            const val = hiddenInput.value;
            if (val.length > 0) {
                const char = val[val.length - 1].toLowerCase();
                if (char.match(/[a-g]/)) {
                    // Slight delay to allow UI to register the keydown if native keyboard fired it
                    setTimeout(() => handleInput(char), 10);
                }
                hiddenInput.value = '';
            }
        });
        
        document.getElementById('btnToggleVirtualKeyboard').addEventListener('click', () => {
            const vk = document.getElementById('virtualKeyboardContainer');
            vk.classList.toggle('hidden');
        });
        
        document.getElementById('btnNativeKeyboard').addEventListener('click', () => {
            hiddenInput.focus();
        });
        
        document.getElementById('btnClearStats').addEventListener('click', () => {
            if (confirm("Вы уверены, что хотите полностью удалить статистику тренировок? Восстановить её будет невозможно!")) {
                noteStats = {};
                if (typeof savePreferences === 'function') savePreferences();
                if (isStatsVisible) updateStatsView();
                showToast("Статистика тренировок удалена!");
            }
        });

        document.getElementById('btnResetKeys').addEventListener('click', () => {
            keyMap = { flat: 'j', sharp: 'k', down: ' ', up: 'n' };
            renderAccKeys();
            if (typeof savePreferences === 'function') savePreferences();
        });
        
        document.getElementById('btnLJKKeys').addEventListener('click', () => {
            keyMap = { flat: 'l', sharp: ';', down: 'j', up: 'k' };
            renderAccKeys();
            if (typeof savePreferences === 'function') savePreferences();
        });
        modeSelect.addEventListener('change', generateNewWord);
        accidentalToggleCheck.addEventListener('change', generateNewWord);
        const scaleRootSelect = document.getElementById('scaleRootSelect');
        const scaleTypeSelect = document.getElementById('scaleTypeSelect');
        const scaleOptionsContainer = document.getElementById('scaleOptionsContainer');
        scaleRootSelect.addEventListener('change', generateNewWord);
        scaleTypeSelect.addEventListener('change', generateNewWord);
        strictOctaveToggle.addEventListener('change', () => {
            if (!strictOctaveToggle.disabled) {
                strictOctaveToggle.dataset.userChecked = strictOctaveToggle.checked;
            }
            const highlight = document.getElementById('octaveHighlight');
            if (strictOctaveToggle.checked) {
                highlight.classList.remove('hidden');
            } else {
                highlight.classList.add('hidden');
            }
        });

        // Time Trial Logic
        document.getElementById('btnTrial').addEventListener('click', () => {
            if(isTimeTrial || isSpeedRun) return;
            if (modeSelect.value !== 'words' && modeSelect.value !== 'random') {
                modeSelect.value = 'random';
            }
            isTimeTrial = true;
            modeSelect.disabled = true;
            score = 0;
            mistakes = 0;
            scoreVal.textContent = score;
            mistakeVal.textContent = mistakes;
            timerDisplay.classList.remove('hidden');
            timerDisplay.textContent = "60 с";
            
            overlay.classList.remove('hidden');
            let count = 3;
            overlayText.textContent = count;
            
            const countInt = setInterval(() => {
                count--;
                if(count > 0) {
                    overlayText.textContent = count;
                } else if(count === 0) {
                    overlayText.textContent = "ПОЕХАЛИ!";
                } else {
                    clearInterval(countInt);
                    overlay.classList.add('hidden');
                    generateNewWord();
                    startTimer();
                }
            }, 1000);
        });

        function startSpeedRunBase(isLoadedSong = false) {
            if(isTimeTrial || isSpeedRun) return;
            
            if (isLoadedSong) {
                modeSelect.value = 'practice';
            } else if (modeSelect.value !== 'random' && modeSelect.value !== 'words' && modeSelect.value !== 'training' && modeSelect.value !== 'scale' && modeSelect.value !== 'a-g') {
                modeSelect.value = 'random';
            }
            
            isSpeedRun = true;
            modeSelect.disabled = true;
            score = 0;
            mistakes = 0;
            scoreVal.textContent = score;
            mistakeVal.textContent = mistakes;
            timerDisplay.classList.remove('hidden');
            timerDisplay.textContent = "0.0 с";
            
            overlay.classList.remove('hidden');
            let count = 3;
            overlayText.textContent = count;
            
            const countInt = setInterval(() => {
                count--;
                if(count > 0) {
                    overlayText.textContent = count;
                } else if(count === 0) {
                    overlayText.textContent = "ПОЕХАЛИ!";
                } else {
                    clearInterval(countInt);
                    overlay.classList.add('hidden');
                    generateNewWord(!isLoadedSong); // Pass true only for 100 notes random
                    startSpeedRunTimer();
                }
            }, 1000);
        }

        document.getElementById('btnSpeedRun').addEventListener('click', () => startSpeedRunBase(false));
        
        document.getElementById('btnLoadedSong').addEventListener('click', () => startSpeedRunBase(true));

        function startTimer() {
            timeRemaining = 60;
            timerInterval = setInterval(() => {
                if (isPaused) return;
                timeRemaining--;
                timerDisplay.textContent = timeRemaining + " с";
                if(timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    endTimeTrial();
                }
            }, 1000);
        }

        function startSpeedRunTimer() {
            speedRunStartTime = Date.now();
            timerInterval = setInterval(() => {
                if (isPaused) return;
                const now = Date.now();
                const diff = (now - speedRunStartTime) / 1000;
                timerDisplay.textContent = diff.toFixed(1) + " с";
            }, 100);
        }

        function endTimeTrial() {
            isTimeTrial = false;
            timerDisplay.classList.add('hidden');
            showSharedCard(score, mistakes, modeSelect.value, "Время вышло!", false, "", encodeRange(rangeTopY, rangeBottomY));
        }

        function endSpeedRun() {
            isSpeedRun = false;
            clearInterval(timerInterval);
            const now = Date.now();
            const finalTime = ((now - speedRunStartTime) / 1000).toFixed(2);
            timerDisplay.classList.add('hidden');
            
            let finalModeStr = 'speedrun';
            let finalTitle = `Спидран: ${finalTime} с`;
            if (modeSelect.value === 'practice') {
                finalModeStr = 'speedrun-practice';
            }
            
            showSharedCard(score, mistakes, finalModeStr, finalTitle, false, finalTime, encodeRange(rangeTopY, rangeBottomY));
        }

        function showSharedCard(s, m, mode, title="Результат по ссылке", isFaked=false, timeStr="", rangeStr="") {
            document.getElementById('statsTitle').textContent = title;
            document.getElementById('modalScore').textContent = s;
            
            const badge = document.getElementById('verifiedBadge');
            if (!isFaked && (new URLSearchParams(window.location.search).has('sig') || title.includes('Результат по ссылке') || title.includes('Спидран'))) {
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            document.getElementById('modalMistakes').textContent = m;
            
            let accuracy = (parseInt(s) + parseInt(m)) > 0 ? ((parseInt(s) / (parseInt(s) + parseInt(m))) * 100).toFixed(1) : 0;
            const modeNames = { words: 'Слова', random: 'Случайно', scale: 'Гаммы', 'a-g': 'Прогон A-G', freeplay: 'Свободная игра', recording: 'Запись', practice: 'Практика', training: 'Тренировка (SRS)', speedrun: 'Спидран', 'speedrun-practice': 'Спидран (практика)' };
            let modeDisplay = modeNames[mode] || mode;
            
            let timeInSecs = parseFloat(timeStr) || 60;
            let npm = timeInSecs > 0 ? Math.round(parseInt(s) * 60 / timeInSecs) : 0;
            document.getElementById('modalNPM').textContent = npm;
            
            if (timeStr) {
                modeDisplay += ` (${accuracy}% точности)`;
            }
            document.getElementById('modalMode').textContent = modeDisplay;
            
            statsModal.dataset.mode = mode;
            statsModal.dataset.time = timeStr;
            statsModal.dataset.range = rangeStr;
            
            const rangeContainer = document.getElementById('modalRangeContainer');
            if (rangeStr && rangeStr.length === 2) {
                const r = decodeRange(rangeStr);
                if (r) {
                    const rRect = document.getElementById('modalRangeRect');
                    rRect.setAttribute('y', r.top);
                    rRect.setAttribute('height', Math.max(0, r.bottom - r.top));
                    rangeContainer.classList.remove('hidden');
                } else {
                    rangeContainer.classList.add('hidden');
                }
            } else {
                rangeContainer.classList.add('hidden');
            }
            
            if (isFaked) {
                document.getElementById('fakedStamp').classList.remove('hidden');
                document.getElementById('btnShare').classList.add('hidden'); 
            } else {
                document.getElementById('fakedStamp').classList.add('hidden');
                document.getElementById('btnShare').classList.remove('hidden');
            }
            statsModal.classList.remove('hidden');
        }

        statsModal.addEventListener('click', (e) => {
            if (e.target === statsModal) {
                document.getElementById('btnCloseModal').click();
            }
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => {
            statsModal.classList.add('hidden');
            modeSelect.disabled = false;
            // Reset for freeplay
            score = 0; mistakes = 0;
            scoreVal.textContent = "0"; mistakeVal.textContent = "0";
            // Clean url
            const url = new URL(window.location.href);
            url.search = '';
            window.history.replaceState({}, document.title, url.toString());
            generateNewWord();
        });

        document.getElementById('btnShare').addEventListener('click', async () => {
            const s = document.getElementById('modalScore').textContent;
            const m = document.getElementById('modalMistakes').textContent;
            let mode = statsModal.dataset.mode || modeSelect.value;
            const t = statsModal.dataset.time || "";
            const r = statsModal.dataset.range || "";
            const sig = await generateSig(s, m, mode, t, r);
            
            const url = new URL(window.location.href);
            url.searchParams.set('s', s);
            url.searchParams.set('w', m);
            url.searchParams.set('m', mode);
            if (t) url.searchParams.set('t', t);
            if (r) url.searchParams.set('r', r);
            url.searchParams.set('sig', sig);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                showToast("Ссылка скопирована в буфер обмена!");
            });
        });

        document.getElementById('btnClearRecording').addEventListener('click', () => {
            recordedString = "";
            recordingDisplay.textContent = "";
            if (typeof rebuildRecording === 'function') rebuildRecording();
        });

        document.getElementById('btnShareRecording').addEventListener('click', () => {
            if (!recordedString) {
                showToast("Сначала сыграйте несколько нот!");
                return;
            }
            const url = new URL(window.location.href);
            url.searchParams.set('practice', recordedString);
            window.history.replaceState({}, document.title, url.toString());
            navigator.clipboard.writeText(url.toString()).then(() => {
                showToast("Ссылка на практику скопирована!");
            });
            const str = recordedString.toLowerCase().replace(/[^a-gjl;k\+]/g, '');
            const tokens = str.match(/[a-g](?:\+[a-g])*|[l;jk]/g) || [];
            let notes = [];
            let mod = '';
            let tempOctave = 0;
            for (let token of tokens) {
                if (token === 'k') { tempOctave = Math.min(3, tempOctave + 1); continue; }
                if (token === 'j') { tempOctave = Math.max(-3, tempOctave - 1); continue; }
                if (token === 'l' || token === ';') { mod = token; } else {
                    let acc = ''; if (mod === 'l') acc = 'b'; else if (mod === ';') acc = '#';
                    notes.push({char: token, acc, octave: tempOctave}); mod = '';
                }
            }
            if (notes.length > 0) {
                practiceArr = notes;
                document.getElementById('practiceOption').style.display = 'block';
                modeSelect.value = 'practice';
                generateNewWord();
            }
        });

        // Initialize and check for shared URL
        window.onload = async () => {
            const lengths = new Set(words.map(w => w.length));
            const sortedLengths = Array.from(lengths).sort((a, b) => a - b);
            sortedLengths.forEach(len => {
                const opt = document.createElement('option');
                opt.value = len;
                opt.textContent = len + '+';
                wordLengthSelect.appendChild(opt);
            });
            wordLengthSelect.addEventListener('change', () => {
                savePreferences();
                generateNewWord();
            });

            const saved = localStorage.getItem('speedSheetsPrefs');
            if (saved) {
                try {
                    const prefs = JSON.parse(saved);
                    overlayToggle.checked = prefs.overlay !== false;
                    flashToggle.checked = prefs.flash !== false;
                    soundToggle.checked = prefs.sound === true;
                    accidentalToggleCheck.checked = prefs.accidental !== false;
                    persistentAccidentalToggle.checked = prefs.persistent === true;
                    if (prefs.alwaysShow !== undefined) alwaysShowToggle.checked = prefs.alwaysShow === true;
                    if (prefs.keyMap) {
                        keyMap = prefs.keyMap;
                        renderAccKeys();
                    }
                    if (prefs.mode) {
                        modeSelect.value = prefs.mode;
                    }
                    if (prefs.wordLength) {
                        wordLengthSelect.value = prefs.wordLength;
                    }
                    if (prefs.strict !== undefined) {
                        strictOctaveToggle.dataset.userChecked = prefs.strict;
                        strictOctaveToggle.checked = prefs.strict;
                    }
                    if (prefs.noteStats) noteStats = prefs.noteStats;
                    if (prefs.rangeTopY !== undefined) rangeTopY = prefs.rangeTopY;
                    if (prefs.rangeBottomY !== undefined) rangeBottomY = prefs.rangeBottomY;
                    if (prefs.isRangeVisible !== undefined) {
                        isRangeVisible = prefs.isRangeVisible;
                        rangeSelectorGroup.classList.toggle('hidden', !isRangeVisible);
                        btnToggleRange.classList.toggle('text-indigo-600', isRangeVisible);
                    }
                } catch(e) {}
            }
            updateRangeUI();
            updateStatsView();

            updateOctaveUI();
            strictOctaveToggle.dispatchEvent(new Event('change'));
            
            const params = new URLSearchParams(window.location.search);
            if (params.has('practice')) {
                const str = params.get('practice').toLowerCase().replace(/[^a-gjl;k\+]/g, '');
                const tokens = str.match(/[a-g](?:\+[a-g])*|[l;jk]/g) || [];
                let notes = [];
                let mod = '';
                let tempOctave = 0;
                for (let token of tokens) {
                    if (token === 'k') { tempOctave = Math.min(3, tempOctave + 1); continue; }
                    if (token === 'j') { tempOctave = Math.max(-3, tempOctave - 1); continue; }
                    if (token === 'l' || token === ';') {
                        mod = token;
                    } else {
                        let acc = '';
                        if (mod === 'l') { acc = 'b'; }
                        else if (mod === ';') { acc = '#'; }
                        notes.push({char: token, acc, octave: tempOctave});
                        mod = '';
                    }
                }
                if (notes.length > 0) {
                    practiceArr = notes;
                    document.getElementById('practiceOption').style.display = 'block';
                    modeSelect.value = 'practice';
                }
            }
            
            if (params.has('s') || params.has('w') || params.has('m')) {
                const s = params.get('s') || "0";
                const w = params.get('w') || "0";
                const m = params.get('m') || "words";
                const t = params.get('t') || "";
                const r = params.get('r') || "";
                const sig = params.get('sig') || "";
                const expected = await generateSig(s, w, m, t, r);
                let title = t ? `Спидран: ${t} с` : "Результат по ссылке";
                if (sig === expected && sig !== "") {
                    showSharedCard(s, w, m, title, false, t, r);
                } else {
                    showSharedCard(s, w, m, "Неверный результат", true, t, r);
                }
            }
            generateNewWord();
        };
    </script>
